name: Supabase Heartbeat

# Supabase 무료 플랜은 프로젝트에 7일 이상 API 요청이 없으면 자동으로 일시정지(pause)된다.
# 이를 막기 위해 주기적으로 가벼운 REST 요청을 보내 프로젝트를 활성 상태로 유지한다.
on:
  schedule:
    - cron: "0 3 * * 1,4" # 매주 월/목 03:00 UTC (KST 12:00)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secret이 설정되지 않았습니다." >&2
            exit 1
          fi

          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/posts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Response status: $status"
          cat /tmp/response.json

          if [ "$status" -ge 500 ]; then
            echo "Supabase가 5xx로 응답했습니다 (프로젝트가 pause 상태일 수 있음)." >&2
            exit 1
          fi
